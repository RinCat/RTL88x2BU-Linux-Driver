# T3: Run L2 host differential tests on pull requests (no kernel / hardware).
# T10: pull_request always triggers; job-level paths-filter skips out-of-scope PRs.
# See docs/rust-migration/issues/test-03-ci-host-tests.md

name: Host L2 tests

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - 'core/crypto/**'
      - 'core/rtw_io.c'
      - 'core/rtw_io_rest.c'
      - 'core/rtw_rf.c'
      - 'core/rtw_rf_op_class_pref.c'
      - 'core/rtw_rf_op_class_dump.c'
      - 'core/rtw_rf_dump_txpwr_lmt.c'
      - 'core/rtw_rf_kfree_tx_gain.c'
      - 'core/rtw_rf_rest.c'
      - 'core/rtw_rm_util_rest.c'
      - 'core/rtw_chplan.c'
      - 'core/rtw_chplan_rest.c'
      - 'core/rtw_chplan.h'
      - 'core/rtw_swcrypto.c'
      - 'core/rtw_swcrypto_rest.c'
      - 'core/rtw_ieee80211.c'
      - 'core/rtw_ieee80211_rest.c'
      - 'core/rtw_rm_util.c'
      - 'core/rtw_rm_util_rest.c'
      - 'core/rtw_vht.c'
      - 'core/rtw_vht_build.c'
      - 'core/rtw_vht_rest.c'
      - 'core/rtw_recv.c'
      - 'core/rtw_recv_rest.c'
      - 'core/rtw_recv_llc_rest.c'
      - 'core/rtw_recv_pn_rest.c'
      - 'core/rtw_xmit.c'
      - 'core/rtw_xmit_rest.c'
      - 'core/rtw_xmit_qos_rest.c'
      - 'core/rtw_xmit_sctx_rest.c'
      - 'core/rtw_mlme.c'
      - 'core/rtw_mlme_rest.c'
      - 'core/rtw_mlme_ext.c'
      - 'core/rtw_mlme_ext_rest.c'
      - 'core/rtw_iol.c'
      - 'core/rtw_iol_rest.c'
      - 'core/rtw_sta_mgt.c'
      - 'core/rtw_sta_mgt_rest.c'
      - 'core/rtw_sta_mgt_stctl.c'
      - 'core/rtw_sta_mgt_lookup.c'
      - 'core/rtw_ap_rest.c'
      - 'core/rtw_ap_sta_ie.c'
      - 'core/rtw_security.c'
      - 'core/rtw_security_rest.c'
      - 'core/rtw_wlan_util.c'
      - 'rust/**'
      - 'tests/host/**'
      - 'Makefile'
      - '.github/workflows/host-l2.yml'
  pull_request:

jobs:
  host-l2:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.83.0
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            l2:
              - 'core/crypto/**'
              - 'core/rtw_io.c'
              - 'core/rtw_io_rest.c'
              - 'core/rtw_rf.c'
              - 'core/rtw_rf_op_class_pref.c'
              - 'core/rtw_rf_op_class_dump.c'
              - 'core/rtw_rf_dump_txpwr_lmt.c'
              - 'core/rtw_rf_kfree_tx_gain.c'
              - 'core/rtw_rf_rest.c'
              - 'core/rtw_rm_util_rest.c'
              - 'core/rtw_chplan.c'
              - 'core/rtw_chplan_rest.c'
              - 'core/rtw_chplan.h'
              - 'core/rtw_swcrypto.c'
              - 'core/rtw_swcrypto_rest.c'
              - 'core/rtw_ieee80211.c'
              - 'core/rtw_ieee80211_rest.c'
              - 'core/rtw_rm_util.c'
              - 'core/rtw_vht.c'
              - 'core/rtw_vht_build.c'
              - 'core/rtw_vht_rest.c'
              - 'core/rtw_recv.c'
              - 'core/rtw_recv_rest.c'
              - 'core/rtw_recv_llc_rest.c'
              - 'core/rtw_recv_pn_rest.c'
              - 'core/rtw_xmit.c'
              - 'core/rtw_xmit_rest.c'
              - 'core/rtw_xmit_qos_rest.c'
              - 'core/rtw_xmit_sctx_rest.c'
              - 'core/rtw_mlme.c'
              - 'core/rtw_mlme_rest.c'
              - 'core/rtw_mlme_ext.c'
              - 'core/rtw_mlme_ext_rest.c'
              - 'core/rtw_iol.c'
              - 'core/rtw_iol_rest.c'
              - 'core/rtw_sta_mgt.c'
              - 'core/rtw_sta_mgt_rest.c'
              - 'core/rtw_sta_mgt_stctl.c'
              - 'core/rtw_sta_mgt_lookup.c'
              - 'core/rtw_ap_rest.c'
              - 'core/rtw_ap_sta_ie.c'
              - 'core/rtw_security.c'
              - 'core/rtw_security_rest.c'
              - 'core/rtw_wlan_util.c'
              - 'rust/**'
              - 'tests/host/**'
              - 'Makefile'
              - '.github/workflows/host-l2.yml'

      - name: Out of scope — skip L2
        if: steps.filter.outputs.l2 != 'true'
        run: echo "PR does not touch L2 paths — reporting success without host tests"

      - name: Install toolchain
        if: steps.filter.outputs.l2 == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
          rustup toolchain install 1.83.0 --profile minimal

      - name: Domain type unit tests (A1)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/domain test

      - name: Host crypto parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/crypto all

      - name: Host chplan lookup parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/chplan test

      - name: Host IE parse parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/ie test

      - name: Host swcrypto parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/swcrypto test

      - name: Host security parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/security test

      - name: Host wlan_util parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/wlan_util test

      - name: Host io_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/io test

      - name: Host rf_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/rf test

      - name: Host rm_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/rm test

      - name: Host vht_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/vht test

      - name: Host sta_mgt_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/sta_mgt test

      - name: Host recv_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/recv test

      - name: Host xmit_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/xmit all

      - name: Host iol_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/iol test

      - name: Host mlme_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/mlme test

      - name: Host mlme_ext_rest parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/mlme_ext test

      - name: Host cmd_priv parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/cmd test

      - name: Host ap_rest / ap_sta_ie parity (L2)
        if: steps.filter.outputs.l2 == 'true'
        run: make -C tests/host/ap test

